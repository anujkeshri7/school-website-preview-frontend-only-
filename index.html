        // ============================================

        function navigate(page) {
            currentPage = page;
            mobileMenuOpen = false;
            adminMenuOpen = false;
            window.scrollTo(0, 0);
            render();
        }

        function loadErpPortal() {
            window.location.href = 'erp.html';
        }
        function loadAdmissionPortal() {
            window.location.href = 'admissions.html';
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            render();
        }

        function filterGallery(category) {
            activeGalleryCategory = category;
            render();
        }

        function filterEvents(category) {
            activeEventCategory = category;
            render();
        }

        function toggleFaq(index) {
            expandedFaq = expandedFaq === index ? null : index;
            render();
        }

        function openLightbox(src) {
            lightboxOpen = true;
            lightboxImage = src;
            render();
        }

        function closeLightbox() {
            lightboxOpen = false;
            lightboxImage = null;
            render();
        }

        function render() {
            const app = document.getElementById('app');

            let pageContent = '';
            switch (currentPage) {
                case 'home': pageContent = HomePage(); break;
                case 'about': pageContent = AboutPage(); break;
                case 'academics': pageContent = AcademicsPage(); break;
                case 'admissions': pageContent = AdmissionsPage(); break;
                case 'facilities': pageContent = FacilitiesPage(); break;
                case 'events': pageContent = EventsPage(); break;
                case 'gallery': pageContent = GalleryPage(); break;
                case 'notice': pageContent = NoticePage(); break;
                case 'results': pageContent = ResultsPage(); break;
                case 'faculty': pageContent = FacultyPage(); break;
                case 'contact': pageContent = ContactPage(); break;
                case 'admin': pageContent = AdminDashboardPage(); break;
                case 'admin-notices': pageContent = AdminNoticesPage(); break;
                case 'admin-events': pageContent = AdminEventsPage(); break;
                case 'admin-gallery': pageContent = AdminGalleryPage(); break;
                case 'admin-faculty': pageContent = AdminFacultyPage(); break;
                case 'admin-admissions': pageContent = AdminAdmissionsPage(); break;
                case 'admin-papers': pageContent = AdminPapersPage(); break;
                case 'admin-results': pageContent = AdminResultsPage(); break;
                case 'admin-facilities': pageContent = AdminFacilitiesPage(); break;
                case 'admin-testimonials': pageContent = AdminTestimonialsPage(); break;
                case 'admin-inquiries': pageContent = AdminInquiriesPage(); break;
                case 'admin-settings': pageContent = AdminSettingsPage(); break;
                default: pageContent = HomePage();
            }

            app.innerHTML = pageContent;

            // Trigger animations
            setTimeout(() => {
                const animatedElements = document.querySelectorAll('.animate-fadeInUp, .animate-slideInLeft');
                animatedElements.forEach(el => {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.style.opacity = '';
                    }, 50);
                });
            }, 10);
        }

        // Navbar scroll effect
        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (navbar) {
                if (window.scrollY > 100) {
                    navbar.classList.add('shadow-lg');
                } else {
                    navbar.classList.remove('shadow-lg');
                }
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pageParam = urlParams.get('page');
            if (pageParam) {
                currentPage = pageParam;
            }
            render();
        });
    </script>
