<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shri Chamunda School - ERP System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#567C8D',      // Teal
                        primaryDark: '#2F4156',  // Navy
                        navy: '#2F4156',
                        navyLight: '#475B70',
                        cream: '#F5EFEB',
                        softGray: '#F9FAFB',
                        accent: {
                            blue: '#C8D9E6',
                            green: '#22C55E',
                            yellow: '#F59E0B'
                        },
                        red: {
                            50: '#F5EFEB',
                            100: '#C8D9E6',
                            200: '#C8D9E6',
                            500: '#567C8D',
                            600: '#567C8D',
                            700: '#567C8D',
                        }
                    },
                    fontFamily: {
                        display: ['Poppins', 'sans-serif'],
                        sans: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --primary: #567C8D;
            --navy: #2F4156;
            --cream: #F5EFEB;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #F9FAFB;
            color: var(--navy);
        }

        .pattern-bg {
            background-image: radial-gradient(circle at 1px 1px, rgba(47, 65, 86, 0.02) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(47, 65, 86, 0.05), 0 2px 8px -2px rgba(47, 65, 86, 0.03);
        }

        .card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -4px rgba(47, 65, 86, 0.1), 0 4px 12px -4px rgba(47, 65, 86, 0.04);
        }
        
        * {
            scroll-behavior: smooth;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        .animate-slideInLeft {
            animation: slideInLeft 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pulse glow animation for System Online */
        .online-pulse {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>
<body class="pattern-bg min-h-screen text-navy antialiased">
    <!-- Main App Container -->
    <div id="erp-app" class="flex flex-col min-h-screen">
        <!-- Loader Splash -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <div class="relative w-16 h-16 mb-4 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border-4 border-primary/10"></div>
                <div class="absolute inset-0 rounded-full border-4 border-t-primary border-r-transparent border-b-transparent border-l-transparent animate-spin"></div>
                <span class="font-bold text-base tracking-wider text-primary">SC</span>
            </div>
            <p class="text-xs font-semibold tracking-wider text-navyLight/60 animate-pulse uppercase">Connecting To ERP Gateway...</p>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] space-y-2 pointer-events-none"></div>

        // Custom SVGs
        function ERPIcon(type) {
            const icons = {

                admissions: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5l7 7v9a2 2 0 01-2 2z"/></svg>`,
                settings: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.89 3.31.877 2.42 2.42a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.89 1.543-.877 3.31-2.42 2.42a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.89-3.31-.877-2.42-2.42a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.89-1.543.877-3.31 2.42-2.42.996.575 2.247.03 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`

        // Navigation Sidebar Links
        const erpLinks = [
            { id: 'overview', label: 'Overview', icon: 'overview' },
            { id: 'students', label: 'Student Management', icon: 'students' },
            { id: 'fees', label: 'Fee Management', icon: 'fees' },
            { id: 'transport', label: 'Transport', icon: 'transport' },
            { id: 'staff', label: 'Staff & HR', icon: 'staff' },
            { id: 'admissions', label: 'Admissions', icon: 'admissions' },
            { id: 'settings', label: 'Settings', icon: 'settings' }
        ];

        // Toast Handler
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl shadow-xl flex items-center gap-3 text-xs font-bold border pointer-events-auto animate-fadeIn ${
                type === 'success' ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'
            }`;
            
            const icon = type === 'success' 
                ? `<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`
                : `<svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;
                
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                toast.style.transition = 'opacity 0.4s ease-out';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Event Listeners and Triggers
        function navigateERP(page) {
            state.currentPage = page;
            state.sidebarOpen = false;
            state.showNotificationsDropdown = false;
            state.showProfileDropdown = false;
            window.scrollTo(0, 0);
            renderERP();
        }

        function toggleMobileSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            renderERP();
        }

        function toggleNotificationsDropdown() {
            state.showNotificationsDropdown = !state.showNotificationsDropdown;
            state.showProfileDropdown = false;
            renderERP();
        }

        function toggleProfileDropdown() {
            state.showProfileDropdown = !state.showProfileDropdown;
            state.showNotificationsDropdown = false;
            renderERP();
        }

        function clearNotifications() {
            state.notifications = [];
            showToast('All notifications cleared');
            renderERP();
        }

        function setStaffTab(tab) {
            state.activeStaffTab = tab;
            renderERP();
        }

        function searchStaff(val) {
            state.staffSearchQuery = val;
            renderERP();
        }

        function setStudentTab(tab) {
            state.activeStudentTab = tab;
            renderERP();
        }

        function searchStudents(val) {
            state.studentSearchQuery = val;
            renderERP();
        }

        // Search in fees
        function searchFees(val) {
            state.feeSearchQuery = val;
            renderERP();
        }

        // Add/Remove Staff
        function openAddStaffModal() {
            state.showAddStaffModal = true;
            renderERP();
            document.getElementById('staff-date-input').valueAsDate = new Date();
        }

        function closeAddStaffModal() {
            state.showAddStaffModal = false;
            renderERP();
        }

        function submitAddStaff(e) {
            e.preventDefault();
            const name = document.getElementById('staff-name-input').value.trim();
            const designation = document.getElementById('staff-desig-input').value.trim();
            const category = document.getElementById('staff-cat-input').value;
            const email = document.getElementById('staff-email-input').value.trim();
            const phone = document.getElementById('staff-phone-input').value.trim();
            const joiningDate = document.getElementById('staff-date-input').value;

            const newId = `STF-0${state.staffList.length + 1}`;
            state.staffList.push({ id: newId, name, designation, email, phone, joiningDate, status: 'Active', category });
            
            state.notifications.unshift({
                id: Date.now(),
                message: `New staff member registered: ${name} (${designation})`,
                time: 'Just now'
            });

            closeAddStaffModal();
            showToast(`Staff member "${name}" registered successfully!`);
        }

        function deleteStaff(id) {
            const staff = state.staffList.find(s => s.id === id);
            if (!staff) return;
            if (confirm(`Are you sure you want to remove ${staff.name} from the staff records?`)) {
                state.staffList = state.staffList.filter(s => s.id !== id);
                showToast(`Staff member "${staff.name}" removed successfully.`);
                renderERP();
            }
        }

        function editStaff(id) {
            const staff = state.staffList.find(s => s.id === id);
            if (!staff) return;
            
            const newName = prompt(`Edit name for ${staff.name}:`, staff.name);
            if (newName === null) return;
            
            const newDesig = prompt(`Edit designation for ${staff.name}:`, staff.designation);
            if (newDesig === null) return;

            staff.name = newName.trim();
            staff.designation = newDesig.trim();
            
            showToast(`Staff profile updated successfully!`);
            renderERP();
        }

        // Add/Remove Students
        function openAddStudentModal() {
            state.showAddStudentModal = true;
            renderERP();
        }

        function closeAddStudentModal() {
            state.showAddStudentModal = false;
            renderERP();
        }

        function submitAddStudent(e) {
            e.preventDefault();
            const name = document.getElementById('stud-name-input').value.trim();
            const rollNo = document.getElementById('stud-roll-input').value.trim();
            const className = document.getElementById('stud-class-input').value;
            const parent = document.getElementById('stud-parent-input').value.trim();
            const phone = document.getElementById('stud-phone-input').value.trim();
            const feeStatus = document.getElementById('stud-fee-input').value;

            if (state.studentList.some(s => s.rollNo === rollNo)) {
                showToast(`Roll Number ${rollNo} already exists!`, 'error');
                return;
            }

            state.studentList.push({ rollNo, name, className, parent, phone, status: 'Active', feeStatus });

            if (feeStatus === 'Pending') {
                state.pendingFeesCount++;
            }

            state.notifications.unshift({
                id: Date.now(),
                message: `New student enrolled: ${name} (${className})`,
                time: 'Just now'
            });

            closeAddStudentModal();
            showToast(`Student "${name}" added to class list!`);
        }

        // Delete student
        function deleteStudent(rollNo) {
            const student = state.studentList.find(s => s.rollNo === rollNo);
            if (!student) return;
            if (confirm(`Are you sure you want to delete student ${student.name} (${student.rollNo})?`)) {
                if (student.feeStatus === 'Pending') {
                    state.pendingFeesCount = Math.max(0, state.pendingFeesCount - 1);
                }
                state.studentList = state.studentList.filter(s => s.rollNo !== rollNo);
                showToast(`Student "${student.name}" records deleted.`);
                renderERP();
            }
        }

        function editStudent(rollNo) {
            const student = state.studentList.find(s => s.rollNo === rollNo);
            if (!student) return;

            const newName = prompt(`Edit student name for ${student.name}:`, student.name);
            if (newName === null) return;

            const newParent = prompt(`Edit parent name for ${student.name}:`, student.parent);
            if (newParent === null) return;

            student.name = newName.trim();
            student.parent = newParent.trim();

            showToast(`Student record updated!`);
            renderERP();
        }

        // Record Payments
        function openRecordPaymentModal(rollNo) {
            const student = state.studentList.find(s => s.rollNo === rollNo);
            if (!student) return;
            state.selectedPaymentStudent = student;
            state.showRecordPaymentModal = true;
            renderERP();
            document.getElementById('payment-date-input').valueAsDate = new Date();
        }

        function closeRecordPaymentModal() {
            state.showRecordPaymentModal = false;
            state.selectedPaymentStudent = null;
            renderERP();
        }

        function submitRecordPayment(e) {
            e.preventDefault();
            const student = state.selectedPaymentStudent;
            const method = document.getElementById('payment-method-input').value;
            const date = document.getElementById('payment-date-input').value;

            student.feeStatus = 'Paid';
            state.pendingFeesCount = Math.max(0, state.pendingFeesCount - 1);
            state.feesCollected += 2200;

            const newTxId = `TXN-90${state.feeTransactions.length + 22}`;
            state.feeTransactions.unshift({
                txId: newTxId,
                studentName: student.name,
                className: student.className,
                amount: 2200,
                date,
                method
            });

            state.notifications.unshift({
                id: Date.now(),
                message: `Recorded payment of ₹ 2,200 for ${student.name} via ${method}`,
                time: 'Just now'
            });

            closeRecordPaymentModal();
            showToast(`Fee payment recorded successfully for ${student.name}!`);
        }

        // Admission applications actions
        function approveApplication(id) {
            const app = state.applications.find(a => a.id === id);
            if (!app) return;
            app.status = 'Approved';
            
            const newRoll = `SCH-${200 + state.studentList.length + 1}`;
            state.studentList.push({
                rollNo: newRoll,
                name: app.student,
                className: app.className,
                parent: app.parent,
                phone: app.phone,
                status: 'Active',
                feeStatus: 'Pending'
            });
            state.pendingFeesCount++;

            state.notifications.unshift({
                id: Date.now(),
                message: `Admission request approved for ${app.student}. Assigned roll no: ${newRoll}`,
                time: 'Just now'
            });

            showToast(`Application approved! Student added to class list.`);
            renderERP();
        }

        function rejectApplication(id) {
            const app = state.applications.find(a => a.id === id);
            if (!app) return;
            app.status = 'Rejected';
            showToast(`Application rejected.`, 'error');
            renderERP();
        }

        function triggerDBBackup() {
            showToast('Initiating cloud database backup sync...');
            setTimeout(() => {
                showToast('Database snapshots synced successfully to AWS AP-South S3 bucket.');
            }, 1000);
        }

        function saveSettings() {
            const session = document.getElementById('setting-session').value;
            showToast(`ERP configuration saved. Active Session: ${session}`);
            navigateERP('overview');
        }

        // Layout Components
        function ERPHeader() {
            return `
                <header class="bg-[#2F4156] text-white h-16 fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-4 sm:px-6 shadow-md select-none">
